# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

corpus:    {raw_dir: "data/raw", toc_path: "data/toc.json"}   # NEW for A2 -- ingest/layout/ocr/chunk all read the corpus location from here instead of a hardcoded path

enhance:   {enabled: false, model: "unet_small", type: "diffusion"}   # A2: disabled -- scans are clean (A1 form Section 2), no cleanup step earns its cost on this corpus; see codes/A2_form.md Section 3
layout:    {mode: "heuristic_column_split"}   # A2: replaces the starter's detectron2:layout placeholder -- see src/doc_agent/vision/layout.py
ocr:       {model: "Qwen/Qwen3-VL-4B-Instruct", finetune: false, ocr_text_dir: "data/ocr_text"}   # A2: confirmed -- Qwen3-VL-4B-Instruct, prompted zero-shot per page (not fine-tuned), is the actual engine that produced this corpus; run across 4 Kaggle notebooks (codes/q3_4B_gt_part1..4.ipynb, page_0001-page_1318). Traditional OCR engines (Tesseract/PaddleOCR/EasyOCR/docTR) were benchmarked and rejected for catastrophic accuracy on this corpus's archaic typography -- see notebooks/eda.ipynb Stage 4. ocr_text_dir must contain page/*.txt + bio/*.txt (the pre-computed OCR output); see src/doc_agent/vision/ocr.py's docstring for why OCR isn't re-run live here.
embed:     {model: "BAAI/bge-m3", dim: 1024, batch_size: 32}   # A2: A1's committed embedding model, replaces the starter's MiniLM/384-dim placeholder
index:     {type: "faiss:flat", index_dir: "data/index", chunk_target_words: 200, chunk_min_words: 40, speaker_min_count: 2, bio_similarity_percentile: 10}   # A2: faiss:flat replaces the starter's faiss:hnsw placeholder; chunk_tokens/overlap replaced with the hybrid chunker's own params -- see src/doc_agent/index/chunk.py
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # unchanged -- A3 scope, k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}   # unchanged -- A3 scope
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
